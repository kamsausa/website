<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAMSA Member Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6fa;
      color: #0b2545;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: min(420px, calc(100% - 40px));
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(11,37,69,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #61708a;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 18px;
      border: 1px solid #d7dce5;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: #c8102e;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #c8102e;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Member Login</h1>
    <div class="subtitle">
      Access the KAMSA member portal.
    </div>

    <form id="login-form">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="login-button" type="submit">
        Log in
      </button>
    </form>

    <div id="message"></div>

    <a class="back" href="./index.html">
      ← Back to KAMSA
    </a>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Logging in...";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Log in";
        return;
      }

      window.location.href = "./member.html";
    });
  </script>
</body>
</html>
